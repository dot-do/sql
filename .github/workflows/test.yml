name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Run TypeScript type checking
        run: pnpm typecheck

      # Run vitest run --coverage for each package
      - name: Test shared-types with coverage
        run: pnpm --filter @dotdo/shared-types test -- --coverage

      - name: Test sql.do with coverage
        run: pnpm --filter @dotdo/sql.do test -- --coverage

      - name: Test lake.do with coverage
        run: pnpm --filter @dotdo/lake.do test -- --coverage

      - name: Test dosql with coverage
        run: pnpm --filter @dotdo/dosql test -- --coverage

      - name: Test dolake with coverage
        run: pnpm --filter @dotdo/dolake test -- --coverage

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          # Copy coverage-final.json from each package
          cp packages/shared-types/coverage/coverage-final.json coverage/shared-types.json 2>/dev/null || true
          cp packages/sql.do/coverage/coverage-final.json coverage/sql.do.json 2>/dev/null || true
          cp packages/lake.do/coverage/coverage-final.json coverage/lake.do.json 2>/dev/null || true
          cp packages/dosql/coverage/coverage-final.json coverage/dosql.json 2>/dev/null || true
          cp packages/dolake/coverage/coverage-final.json coverage/dolake.json 2>/dev/null || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: false
